<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="box-1">Menu</label>
            <a href="#" class="box-2">Logo</a>
            <nav class="box-3">
                <a href="#">Menu</a>
            </nav>
            <a href="#" class="box-4">Button</a>
        </div>
    </header>
    <section class="section band">
        <div class="container hero-inner">
            <div class="box-5">Content</div>
            <div class="box-6">Image</div>
        </div>
    </section>
    <section class="section">
        <div class="container">
            <div class="box-7">Title</div>
            <div class="grid grid-3">
            <div class="box-8">Item</div>
            <div class="box-8">Item</div>
            <div class="box-8">Item</div>
            <div class="box-8">Item</div>
            <div class="box-8">Item</div>
            <div class="box-8">Item</div>
            </div>
        </div>
    </section>
    <section class="section band">
        <div class="container">
            <div class="box-7">Title</div>
            <div class="grid grid-5">
            <div class="box-9">Item</div>
            <div class="box-9">Item</div>
            <div class="box-9">Item</div>
            <div class="box-9">Item</div>
            <div class="box-9">Item</div>
            </div>
        </div>
    </section>
    <section class="section">
        <div class="container">
            <div class="box-7">Title</div>
            <div class="grid grid-4">
            <div class="box-9">Item</div>
            <div class="box-9">Item</div>
            <div class="box-9">Item</div>
            <div class="box-9">Item</div>
            </div>
        </div>
    </section>
    <footer class="footer">Footer</footer>
</body>
</html>
